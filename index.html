<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox User Lookup</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    input, button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      margin: 5px;
    }
    input {
      width: 200px;
    }
    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
    }
    button:hover {
      background: #1d4ed8;
    }
    #result {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      min-width: 300px;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <h1>🔍 Roblox User Lookup</h1>
  <div>
    <input id="username" placeholder="Enter username" />
    <button id="lookup">Lookup</button>
  </div>
  <div id="result">Enter a Roblox username to begin.</div>

  <script>
    const PROXIES = [
      'https://snowy-wildflower-84e4.marcusvrwastaken.workers.dev/?url=',
      'https://api.allorigins.win/raw?url=',
      'https://thingproxy.freeboard.io/fetch/'
    ];

    async function fetchWithProxy(url, options = {}) {
      for (const proxy of PROXIES) {
        const finalUrl = proxy + encodeURIComponent(url);
        try {
          const response = await fetch(finalUrl, options);
          if (response.ok) return response;
          console.warn(`Proxy ${proxy} failed (${response.status})`);
        } catch (err) {
          console.warn(`Proxy ${proxy} error`, err);
        }
      }
      throw new Error('All proxies failed. Roblox API may be unreachable.');
    }

    async function lookupUser(username) {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Loading...';
      try {
        const response = await fetchWithProxy(
          `https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=1`
        );
        const data = await response.json();

        if (data.data && data.data.length > 0) {
          const user = data.data[0];
          resultDiv.innerHTML = `
            <h2>${user.name}</h2>
            <img src="https://www.roblox.com/headshot-thumbnail/image?userId=${user.id}&width=150&height=150&format=png" alt="Avatar"><br>
            <p><b>Display Name:</b> ${user.displayName}</p>
            <p><b>User ID:</b> ${user.id}</p>
            <p><a href="https://www.roblox.com/users/${user.id}/profile" target="_blank">View Profile</a></p>
          `;
        } else {
          resultDiv.textContent = 'User not found.';
        }
      } catch (err) {
        console.error(err);
        resultDiv.textContent = 'Rate limited or failed to contact Roblox. Try again later.';
      }
    }

    // Button click event
    document.getElementById('lookup').addEventListener('click', () => {
      const username = document.getElementById('username').value.trim();
      if (username) {
        window.history.pushState({}, '', `/usernames/${username}`);
        lookupUser(username);
      }
    });

    // Auto-load username from URL (for /usernames/username)
    const path = window.location.pathname;
    const match = path.match(/^\/usernames\/([^/]+)/);
    if (match) {
      const username = decodeURIComponent(match[1]);
      document.getElementById('username').value = username;
      lookupUser(username);
    }
  </script>
</body>
</html>
