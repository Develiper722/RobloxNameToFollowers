<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox User Lookup</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background:#0f172a; color:white; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0; padding:20px; }
.card { background:#1e293b; border-radius:12px; padding:24px; max-width:420px; width:100%; box-shadow:0 10px 20px rgba(0,0,0,0.3); text-align:center; }
input, button { padding:10px; border-radius:8px; border:none; outline:none; }
input { width:70%; color:black; }
button { width:25%; background:#2563eb; color:white; font-weight:600; cursor:pointer; transition:0.2s; }
button:hover { background:#1d4ed8; transform:scale(1.02); }
#avatar { border-radius:50%; margin:10px auto; }
a { color:#38bdf8; text-decoration:none; font-weight:500; }
a:hover { text-decoration:underline; }
</style>
</head>
<body>

<h1 class="text-3xl font-bold mb-4">🔍 Roblox User Lookup</h1>

<div class="card">
  <div class="flex justify-center mb-4">
    <input id="inputField" placeholder="Enter username or user ID">
    <button id="lookupButton">Lookup</button>
  </div>
  <div id="result">Enter a Roblox username or ID to start.</div>
</div>

<script>
const PROXY = "https://randomproxy.marcusvrwastaken.workers.dev/";

async function fetchWithProxy(url, options = {}) {
  try {
    const res = await fetch(PROXY + "?url=" + encodeURIComponent(url), options);
    if (!res.ok) throw new Error(`Proxy failed (${res.status})`);
    return await res.json();
  } catch (err) {
    throw new Error("Failed to fetch via proxy: " + err.message);
  }
}

async function getUserByName(username) {
  const url = "https://users.roblox.com/v1/usernames/users";
  return await fetchWithProxy(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ usernames: [username] })
  }).then(data => data.data?.[0] || null);
}

async function getUserById(id) {
  const url = `https://users.roblox.com/v1/users/${id}`;
  return await fetchWithProxy(url);
}

async function lookup(input) {
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = `<p>Loading...</p>`;
  let user = null;

  try {
    if (/^\d+$/.test(input)) {
      user = await getUserById(input);
      if (user.errors) throw new Error("User ID not found");
    } else {
      user = await getUserByName(input);
      if (!user) throw new Error("Username not found");
    }

    const avatarUrl = `https://www.roblox.com/headshot-thumbnail/image?userId=${user.id}&width=180&height=180&format=png`;
    const profileUrl = `https://www.roblox.com/users/${user.id}/profile`;

    resultDiv.innerHTML = `
      <img id="avatar" src="${avatarUrl}" width="180" height="180" alt="Avatar">
      <h2 class="text-2xl font-bold mt-2">${user.name}</h2>
      <p class="text-gray-300">${user.displayName || ''}</p>
      <p><b>User ID:</b> ${user.id}</p>
      ${user.hasVerifiedBadge ? `<p class="text-green-400">✔️ Verified User</p>` : ''}
      <p class="mt-3"><a href="${profileUrl}" target="_blank">View Roblox Profile →</a></p>
    `;
  } catch (err) {
    resultDiv.innerHTML = `<p>${err.message}</p>`;
  }
}

document.getElementById('lookupButton').addEventListener('click', () => {
  const input = document.getElementById('inputField').value.trim();
  if (!input) return;
  const path = /^\d+$/.test(input) ? `/users/${input}` : `/usernames/${input}`;
  window.history.pushState({}, '', path);
  lookup(input);
});

// Auto-load from URL
window.addEventListener('DOMContentLoaded', () => {
  const path = window.location.pathname;
  const nameMatch = path.match(/^\/usernames\/([^/]+)/);
  const idMatch = path.match(/^\/users\/(\d+)/);

  if (nameMatch) {
    const username = decodeURIComponent(nameMatch[1]);
    document.getElementById('inputField').value = username;
    lookup(username);
  } else if (idMatch) {
    const userId = decodeURIComponent(idMatch[1]);
    document.getElementById('inputField').value = userId;
    lookup(userId);
  }
});
</script>

</body>
</html>
