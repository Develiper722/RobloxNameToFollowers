<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Username Lookup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 2em;
    }
    input, button {
      padding: 0.5em;
      margin: 0.5em;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }
    input { width: 250px; }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .user-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.5em;
      margin: 1em auto;
      max-width: 600px;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
    }
    .followers, .friends {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5em;
    }
    .followers a, .friends a {
      color: #60a5fa;
      text-decoration: none;
      border: 1px solid #60a5fa;
      padding: 0.3em 0.6em;
      border-radius: 8px;
    }
    .followers a:hover, .friends a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>Roblox User Lookup</h1>
  <input id="usernameInput" type="text" placeholder="Enter username or ID" />
  <button onclick="lookup()">Lookup</button>
  <div id="result"></div>

  <script>
    const PROXIES = [
      "https://randomproxy.marcusvrwastaken.workers.dev/",
      "https://lucky-king-4d24.marcusvrwastaken.workers.dev/",
      "https://autumn-feather-e685.marcusvrwastaken.workers.dev/",
      "https://shrill-bird-9a78.marcusvrwastaken.workers.dev/",
      "https://sweet-cherry-a82c.marcusvrwastaken.workers.dev/"
    ];

    async function fetchWithProxyFailover(url, options = {}) {
      let lastError = null;
      for (const proxy of PROXIES) {
        try {
          const res = await fetch(proxy + "?url=" + encodeURIComponent(url), options);
          if (!res.ok) throw new Error(`Proxy failed (${res.status})`);
          return await res.json();
        } catch (err) {
          lastError = err;
          console.warn(`Proxy ${proxy} failed:`, err.message);
          await new Promise(r => setTimeout(r, 200));
        }
      }
      throw new Error(`All proxies failed: ${lastError?.message}`);
    }

    async function getUserId(nameOrId) {
      // If numeric, treat as ID directly
      if (/^[0-9]+$/.test(nameOrId)) return nameOrId;

      // Check cache
      const cached = localStorage.getItem("cache:" + nameOrId.toLowerCase());
      if (cached) return cached;

      // Lookup username → ID
      const data = await fetchWithProxyFailover("https://users.roblox.com/v1/usernames/users", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({usernames: [nameOrId], excludeBannedUsers: false})
      });
      const id = data?.data?.[0]?.id;
      if (!id) throw new Error("User not found");
      localStorage.setItem("cache:" + nameOrId.toLowerCase(), id);
      return id;
    }

    async function lookup() {
      const input = document.getElementById("usernameInput").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "Loading...";

      try {
        const userId = await getUserId(input);
        const user = await fetchWithProxyFailover(`https://users.roblox.com/v1/users/${userId}`);

        // Update URL
        const newUrl = `/usernames/${encodeURIComponent(input)}`;
        history.pushState({}, "", newUrl);

        const headshot = `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=180&height=180&format=png`;

        resultDiv.innerHTML = `
          <div class="user-card">
            <img src="${headshot}" width="180" height="180"><br>
            <h2>${user.displayName} (@${user.name}) ${user.hasVerifiedBadge ? "✅" : ""}</h2>
            <p>ID: ${user.id}</p>
            <p><a href="https://www.roblox.com/users/${user.id}/profile" target="_blank">Profile</a></p>
            <button onclick="loadMoreInfo(${user.id})">More Info</button>
            <div id="more-${user.id}"></div>
          </div>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
      }
    }

    async function loadMoreInfo(userId) {
      const container = document.getElementById(`more-${userId}`);
      container.innerHTML = "Loading followers & friends...";

      try {
        const followers = await fetchWithProxyFailover(`https://friends.roblox.com/v1/users/${userId}/followers?limit=100`);
        const friends = await fetchWithProxyFailover(`https://friends.roblox.com/v1/users/${userId}/friends?limit=100`);

        const followerLinks = followers.data.map(f => `<a href="https://www.roblox.com/users/${f.id}/profile" target="_blank">${f.name} (${f.id})</a>`).join(" ");
        const friendLinks = friends.data.map(f => `<a href="https://www.roblox.com/users/${f.id}/profile" target="_blank">${f.name} (${f.id})</a>`).join(" ");

        container.innerHTML = `
          <p><b>Followers (${followers.data.length}):</b></p>
          <div class="followers">${followerLinks}</div>
          <p><b>Friends (${friends.data.length}):</b></p>
          <div class="friends">${friendLinks}</div>
        `;
      } catch (err) {
        container.innerHTML = `<p style="color:red;">Failed to load more info: ${err.message}</p>`;
      }
    }

    // Auto-load if on /usernames/<name>
    window.addEventListener("DOMContentLoaded", () => {
      const path = window.location.pathname;
      if (path.startsWith("/usernames/")) {
        const username = decodeURIComponent(path.split("/")[2] || "");
        if (username) {
          document.getElementById("usernameInput").value = username;
          lookup();
        }
      }
    });
  </script>
</body>
</html>
